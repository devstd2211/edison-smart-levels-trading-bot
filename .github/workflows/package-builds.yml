name: Package Builds

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  contracts:
    name: Build contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build:contracts

  web-server:
    name: Build web-server
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build prerequisites
        run: npm run build:contracts

      - name: Build web-server
        run: npm run build:web-server

      - name: Test web-server
        run: npm run test:web-server

  core:
    name: Build core
    runs-on: ubuntu-latest
    needs: web-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build prerequisites
        run: npm run build:contracts && npm run build:web-server

      - name: Build core
        run: npm run build:core

      - name: Test core
        run: npm run test:core

  web-client:
    name: Build and test web-client
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build prerequisites
        run: npm run build:contracts

      - name: Build web-client
        run: npm run build:web-client

      - name: Test web-client
        run: npm run test:web-client
